; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = crowpanel_146

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -DBOARD_SUPERMINI=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; CrowPanel ESP32-S3 1.46" round ST77961 (360×360) with rotary encoder
[env:crowpanel_146]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/plane_radar_s3.csv
extra_scripts = post:scripts/merge_firmware.py

board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -DBOARD_CROWPANEL_146=1

; Use the vendored LovyanGFX in vendor/crowpanel_146 instead of the registry release:
; the registry build fails against this newer ESP-IDF, and the plain registry 1.2.x
; driver produced a blank/garbled ST77961 screen on this panel.
lib_extra_dirs =
  vendor/crowpanel_146

lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
